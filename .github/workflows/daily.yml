name: daily
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install requests numpy pillow edge-tts
      - run: python bear_facts.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Video zum Ansehen bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" output/video.mp4 --title "$TAG" --notes-file output/caption.txt
      - name: Faktenliste speichern
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add facts_log.json
          git commit -m "log" || true
          git push
